{% extends 'layouts/base.html' %}

{% block content %}
<div class="mb-3">
  <h1 class="h4 mb-1 role-page-title role-page-title-admin">Overview</h1>
  <p class="text-muted role-page-description mb-0">Monitor key service volume and queue indicators across daily clinic operations.</p>
</div>

<div class="row g-3">
  <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-muted small">Pending Appointments</div><div class="h4 mb-0">{{ summary.appointments_pending or 0 }}</div></div></div></div>
  <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-muted small">Active Visit Queue</div><div class="h4 mb-0">{{ summary.visits_active_queue or 0 }}</div></div></div></div>
</div>
{% endblock %}
