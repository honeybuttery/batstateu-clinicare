{% extends 'layouts/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Triage Form - Visit #{{ visit.visit_id }}</h1>
  <a class="btn btn-outline-secondary" href="{{ url_for('nurse.visit_queue') }}">Back to Queue</a>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body">
    <p class="mb-1"><strong>Patient:</strong> {{ visit.patient_name }} ({{ visit.patient_email }})</p>
    <p class="mb-1"><strong>Consultation Type:</strong> {{ visit.consultation_type_name }}</p>
    <p class="mb-0"><strong>Arrival Time:</strong> {{ visit.arrival_time }}</p>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" action="{{ url_for('nurse.triage_form_submit', visit_id=visit.visit_id) }}" class="row g-3">
      <div class="col-md-3">
        <label class="form-label" for="bp">BP</label>
        <input class="form-control" id="bp" name="bp" value="{{ triage.bp if triage else '' }}" placeholder="120/80">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="heart_rate">Heart Rate</label>
        <input class="form-control" type="number" id="heart_rate" name="heart_rate" value="{{ triage.heart_rate if triage else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="respiratory_rate">Respiratory Rate</label>
        <input class="form-control" type="number" id="respiratory_rate" name="respiratory_rate" value="{{ triage.respiratory_rate if triage else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="temperature">Temperature (°C)</label>
        <input class="form-control" type="number" step="0.1" id="temperature" name="temperature" value="{{ triage.temperature if triage else '' }}">
      </div>

      <div class="col-md-3">
        <label class="form-label" for="oxygen_saturation">Oxygen Saturation (%)</label>
        <input class="form-control" type="number" id="oxygen_saturation" name="oxygen_saturation" value="{{ triage.oxygen_saturation if triage else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="weight">Weight (kg)</label>
        <input class="form-control" type="number" step="0.01" id="weight" name="weight" value="{{ triage.weight if triage else '' }}">
      </div>

      <div class="col-md-6">
        <label class="form-label" for="emergency_contact_notified">Emergency Contact/Guardian Notified</label>
        <select class="form-select" id="emergency_contact_notified" name="emergency_contact_notified">
          <option value="">Not specified</option>
          <option value="1" {% if triage and triage.emergency_contact_notified == 1 %}selected{% endif %}>Yes</option>
          <option value="0" {% if triage and triage.emergency_contact_notified == 0 %}selected{% endif %}>No</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="emergency_contact_notified_at">Notification Date/Time</label>
        <input class="form-control" type="datetime-local" id="emergency_contact_notified_at" name="emergency_contact_notified_at">
      </div>

      <div class="col-12">
        <label class="form-label" for="initial_assessment">Initial Assessment</label>
        <textarea class="form-control" id="initial_assessment" name="initial_assessment" rows="3">{{ triage.initial_assessment if triage else '' }}</textarea>
      </div>

      <div class="col-12">
        <label class="form-label" for="immediate_action">Immediate Action Taken</label>
        <textarea class="form-control" id="immediate_action" name="immediate_action" rows="3">{{ triage.immediate_action if triage else '' }}</textarea>
      </div>

      <div class="col-12">
        <label class="form-label" for="referral_details">Referral Details</label>
        <textarea class="form-control" id="referral_details" name="referral_details" rows="2">{{ triage.referral_details if triage else '' }}</textarea>
      </div>

      <div class="col-12">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="2">{{ triage.notes if triage else '' }}</textarea>
      </div>

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Save Triage</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
