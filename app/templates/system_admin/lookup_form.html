{% extends 'layouts/base.html' %}

{% block content %}
<h1 class="h4 mb-3">{{ 'Edit' if item else 'Create' }} {{ 'Triage Level' if lookup_type == 'triage' else 'Consultation Type' }}</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-4"><label class="form-label">Code</label><input class="form-control" name="code" value="{{ item.code if item else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Display Name</label><input class="form-control" name="display_name" value="{{ item.display_name if item else '' }}" required></div>
      <div class="col-md-2"><label class="form-label">Active</label><select class="form-select" name="is_active"><option value="1" {% if not item or item.is_active == 1 %}selected{% endif %}>Yes</option><option value="0" {% if item and item.is_active == 0 %}selected{% endif %}>No</option></select></div>
      <div class="col-12"><a class="btn btn-outline-secondary" href="{{ url_for('system_admin.lookups_list_page', type=lookup_type) }}">Cancel</a><button class="btn btn-primary" type="submit">Save</button></div>
    </form>
  </div>
</div>
{% endblock %}
