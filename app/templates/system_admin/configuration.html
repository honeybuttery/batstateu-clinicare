{% extends 'layouts/base.html' %}

{% block content %}
<div class="mb-3">
  <h1 class="h4 mb-1 role-page-title role-page-title-admin">System Configuration</h1>
  <p class="text-muted role-page-description mb-0">Manage application-wide settings and institutional rules.</p>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-6"><label class="form-label">Application Name</label><input class="form-control" value="{{ config_values.app_name }}" disabled></div>
      <div class="col-md-3"><label class="form-label">Default Report Days</label><input class="form-control" type="number" min="1" name="reports_default_days" value="{{ config_values.reports_default_days }}"></div>
      <div class="col-md-3"><label class="form-label">Audit Log Limit</label><input class="form-control" type="number" min="50" name="audit_log_limit" value="{{ config_values.audit_log_limit }}"></div>
      <div class="col-12">
        <label class="form-label">Allowed Institutional Email Domains</label>
        <textarea class="form-control" name="allowed_email_domains" rows="2" placeholder="batstate-u.edu.ph,g.batstate-u.edu.ph">{{ config_values.allowed_email_domains }}</textarea>
        <div class="form-text">Use comma-separated domains. Example: <code>batstate-u.edu.ph,g.batstate-u.edu.ph</code></div>
      </div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Save Configuration</button></div>
    </form>
    <p class="small text-muted mt-3 mb-0">Changes are persisted to the system settings table.</p>
  </div>
</div>
{% endblock %}
