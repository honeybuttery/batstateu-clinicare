{% extends 'layouts/base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 role-page-title role-page-title-patient">Request Appointment</h1>
        <p class="text-muted role-page-description mb-0">Submit a new consultation request by selecting your preferred physician and schedule.</p>

        <form method="post" action="{{ url_for('patient.appointment_request_submit') }}">
          <div class="mb-3">
            <label for="physician_user_id" class="form-label">Physician</label>
            <select class="form-select" id="physician_user_id" name="physician_user_id" required>
              <option value="">Select physician</option>
              {% for physician in physicians %}
                <option value="{{ physician.user_id }}">{{ physician.institutional_email }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="consultation_type_id" class="form-label">Consultation Type</label>
            <select class="form-select" id="consultation_type_id" name="consultation_type_id" required>
              <option value="">Select type</option>
              {% for ct in consultation_types %}
                <option value="{{ ct.consultation_type_id }}">{{ ct.display_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="scheduled_date" class="form-label">Preferred Date (optional)</label>
              <input type="date" class="form-control" id="scheduled_date" name="scheduled_date">
            </div>
            <div class="col-md-6 mb-3">
              <label for="scheduled_time" class="form-label">Preferred Time (optional)</label>
              <input type="time" class="form-control" id="scheduled_time" name="scheduled_time">
            </div>
          </div>

          <div class="mb-3">
            <label for="reason" class="form-label">Reason (optional)</label>
            <textarea class="form-control" id="reason" name="reason" rows="3" maxlength="255"></textarea>
          </div>

          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="{{ url_for('patient.appointments_list') }}">Cancel</a>
            <button type="submit" class="btn btn-primary">Submit Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
